<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Playlist</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body { background: black; color: white; }
        .card { border-radius: 15px; }
        .btn-secondary {
        background-color: #fb4300;
        color: white;
        }
</style>

    </style>
</head>

<body>
<a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Homepage</a>

<div class="container mt-4">
    <div class="card p-4">

        <h3> Sua Playlist </h3>

        <ul class="list-group mt-3">

            {% if lista_musicas %}
                {% for musica in lista_musicas %}
                    <li class="list-group-item">{{ musica }}</li>
                {% endfor %}
            {% else %}
                <p>Sua playlist está vazia </p>
            {% endif %}

        </ul>

    </div>
</div>

</body>
</html>
