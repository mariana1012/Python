<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Editar Música</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <style>
        .btn-secondary {
        background-color: #fb4300;
        color: white;
        }
    </style>
</head>

<body style="background:black;">
    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Homepage</a>

<div class="container mt-4">
    <div class="card p-4">

        <h3>Editar Música</h3>

        <form action="/editarMusica" method="POST">
            <label class="form-label">Música atual:</label>
            <input type="text" name="musica" class="form-control" required>

            <label class="form-label mt-3">Novo nome:</label>
            <input type="text" name="nova_musica" class="form-control" required>

            <button class="btn btn-main mt-3">Salvar Alterações</button>
        </form>

    </div>
</div>

</body>
</html>
