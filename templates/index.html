<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Ecco </title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body { background: black; }
        .header { background: black; color: white; padding: 25px; text-align: center; margin-bottom: 30px; }
        .card { border-radius: 15px; }
        .btn-main {
            background: #fb4300; color: white;
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .btn-main:hover { background: black; color: white; }
    </style>
</head>

<body>

    <div class="header">
        <h1>Ecco</h1>
    </div>

    <div class="container">

        <div class="row mb-4">
            <div class="col text-center">
                <a href="/adicionarMusica" class="btn btn-main m-2">Adicionar Música</a>
                <a href="/editarMusica" class="btn btn-main m-2">Editar Música</a>
                <a href="/excluirMusica" class="btn btn-main m-2">Excluir Música</a>
                <a href="/playlist" class="btn btn-main m-2">Minha Playlist</a>
                <a href="/cadastrarArtista" class="btn btn-main m-2">Cadastrar Artista</a>
                <a href="/cadastrarOuvinte" class="btn btn-main m-2">Cadastrar Ouvinte</a>
            </div>
        </div>

        <div class="card p-4">
            <h3 class="text-center mb-3"> Bem-vindo ao Ecco </h3>
            <p class="text-center"> Utilize o menu acima para navegar</p>
        </div>

    </div>

</body>
</html>
