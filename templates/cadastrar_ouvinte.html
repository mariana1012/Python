<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastrar Artista</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <style>
        body { background: black; }
        .btn-main {
            background: #fb4300; color: white;
            transition: 0.3s;
        }
        .btn-main:hover { background: black; color: white; }
        .btn-secondary {
        background-color: #fb4300;
        color: white;
        }
    </style>
</head>

<body>
    <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Homepage</a>

<div class="container mt-4">
    <div class="card p-4">
        
        <h3>Cadastrar Artista</h3>

        <form action="/cadastrarArtista" method="POST">
            <label class="form-label">Nome artístico:</label>
            <input type="text" name="nome" class="form-control" required>

            <label class="form-label mt-3">E-mail:</label>
            <input type="email" name="email" class="form-control" required>

            <label class="form-label mt-3">Idade:</label>
            <input type="number" name="idade" class="form-control" required>

            <label class="form-label mt-3">Gênero musical:</label>
            <select name="genero" class="form-select">
                {% for genero in generos %}
                <option value="{{ genero }}">{{ genero }}</option>
                {% endfor %}
            </select>

            <label class="form-label mt-3">Músicas (separadas por vírgula):</label>
            <input type="text" name="musicas" class="form-control">

            <button class="btn btn-main mt-3">Cadastrar</button>
        </form>
    </div>
</div>

</body>
</html>
